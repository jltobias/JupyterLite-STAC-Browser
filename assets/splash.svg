<g font-family="Arial,sans-serif"><text x="72" y="83" fill="#dcec9d" font-size="15" letter-spacing="4">◈ STAC FIELD GUIDE</text><text x="72" y="225" fill="#f7f8f3" font-size="64" font-weight="600">A world of data.</text><text x="72" y="301" fill="#dcec9d" font-size="64" font-weight="600">A place to start.</text><text x="75" y="361" fill="#c1d3c3" font-size="20">Explore the map. Understand the metadata.</text><text x="75" y="394" fill="#c1d3c3" font-size="20">Make it your own — entirely in your browser.</text><rect x="74" y="455" width="313" height="48" rx="5" fill="#dcec9d"/><text x="96" y="485" fill="#244c3e" font-size="16">WORLDPOP · STAC · JUPYTERLITE</text><text x="75" y="572" fill="#a7c0a9" font-size="12" letter-spacing="2">OPEN CATALOGS. LOCAL COMPUTATION. SHARED KNOWLEDGE.</text></g></svg>
